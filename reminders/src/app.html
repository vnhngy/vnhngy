<title>Nudge Reminders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two-pane desk — a sidebar of smart lists beside a working column; editor slides in from the right (sheet on phones). */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eceff4;
  --line: #dde2ea;
  --fg: #18202c;
  --muted: #5d6879;
  --faint: #8a94a5;
  --accent: #2f5bea;
  --accent-soft: #e5ebff;
  --on-accent: #ffffff;
  --danger: #c8372d;
  --danger-soft: #fbe6e4;
  --warn: #b26a00;
  --warn-soft: #fff1d6;
  --ok: #1f8a4c;
  --ok-soft: #dcf3e5;
  --flag: #e07a10;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.08);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-app-theme="light"]) {
    --bg: #0f131a; --surface: #171c25; --surface-2: #1f2531; --line: #2a3140;
    --fg: #e8ecf3; --muted: #9aa4b5; --faint: #6c7689;
    --accent: #7d9bff; --accent-soft: #212c4d; --on-accent: #0f131a;
    --danger: #ff7b70; --danger-soft: #3a1f1d; --warn: #f2b14c; --warn-soft: #3a2c14;
    --ok: #5cd08d; --ok-soft: #173325; --flag: #ffa24a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-app-theme="light"]), :root[data-app-theme="dark"] {
  --bg: #0f131a; --surface: #171c25; --surface-2: #1f2531; --line: #2a3140;
  --fg: #e8ecf3; --muted: #9aa4b5; --faint: #6c7689;
  --accent: #7d9bff; --accent-soft: #212c4d; --on-accent: #0f131a;
  --danger: #ff7b70; --danger-soft: #3a1f1d; --warn: #f2b14c; --warn-soft: #3a2c14;
  --ok: #5cd08d; --ok-soft: #173325; --flag: #ffa24a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
:root[data-app-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr) auto; height: 100%; }

/* Sidebar */
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-scroll { overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand h1 { font: 700 21px/1 var(--font-display); letter-spacing: -.01em; margin: 0; }
.smart { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 9px 10px 8px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; }
.tile .ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.tile .n { font: 700 20px/1 var(--font-display); justify-self: end; font-variant-numeric: tabular-nums; }
.tile .lbl { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 6px; }
.tile[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tile[aria-current="true"] .lbl { color: var(--on-accent); opacity: .9; }
.sec-h { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; padding: 0 6px 4px; }
.icon-btn { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 7px 8px; border-radius: 8px; text-align: left; width: 100%; }
.nav-item:hover { background: var(--surface-2); }
.nav-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.nav-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .cnt { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.nav-item.drop { outline: 2px dashed var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
button.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.side-foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.sync-dot.ok { background: var(--ok); } .sync-dot.busy { background: var(--warn); } .sync-dot.err { background: var(--danger); }
.side-foot .grow { flex: 1; min-width: 0; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 14px 24px 10px; flex-wrap: wrap; }
.menu-btn { display: none; }
.title-wrap { flex: 1; min-width: 160px; display: flex; align-items: baseline; gap: 12px; }
.view-title { font: 700 30px/1.1 var(--font-display); margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.view-sub { color: var(--muted); font-size: 14px; }
.search { position: relative; }
.search input { width: 220px; max-width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px 7px 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 9px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 0 24px 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; }
.toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 6px; font-size: 13.5px; }
.toolbar .spacer { flex: 1; }

.quick { margin: 0 24px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.quick-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.quick-row .plus { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; flex: none; }
.quick input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; outline: none; }
.quick-preview { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px 44px; }
.quick-preview:empty { display: none; }
.quick-hint { padding: 0 12px 10px 44px; font-size: 12.5px; color: var(--faint); }
.quick-hint code { font-family: var(--font-mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; color: var(--muted); }

.content { flex: 1; overflow-y: auto; padding: 0 24px 40px; min-height: 0; }
.group { margin-top: 10px; }
.group-h { display: flex; align-items: center; gap: 8px; font: 700 14px/1 var(--font-display); color: var(--muted); padding: 10px 4px 8px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.group-h .n { font: 500 12px var(--font-mono); color: var(--faint); }
.group-h.overdue { color: var(--danger); }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-top: 1px solid var(--line); position: relative; }
.row:first-child { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.row.sel { background: var(--accent-soft); }
.row.kb { box-shadow: inset 3px 0 0 var(--accent); }
.row.dragging { opacity: .4; }
.row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.grip { width: 14px; color: var(--faint); cursor: grab; padding-top: 3px; display: none; }
.manual .grip { display: block; }
.manual .row { grid-template-columns: auto auto minmax(0,1fr) auto; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--faint); background: transparent; display: grid; place-items: center; margin-top: 1px; padding: 0; color: transparent; }
.check:hover { border-color: var(--accent); }
.check.p3 { border-color: var(--danger); } .check.p2 { border-color: var(--warn); } .check.p1 { border-color: var(--accent); }
.check.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check.pop { animation: pop .35s ease; }
@keyframes pop { 40% { transform: scale(1.25); } }
.r-main { min-width: 0; cursor: pointer; }
.r-title { font-size: 15.5px; overflow-wrap: anywhere; }
.row.is-done .r-title { color: var(--faint); text-decoration: line-through; }
.r-title .prio { color: var(--danger); font-weight: 700; margin-right: 4px; font-family: var(--font-mono); }
.r-notes { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; font-size: 12.5px; color: var(--muted); align-items: center; }
.r-meta .due { font-family: var(--font-mono); font-size: 12px; }
.r-meta .due.over { color: var(--danger); font-weight: 500; }
.r-meta .due.soon { color: var(--warn); font-weight: 500; }
.r-meta .m { display: inline-flex; align-items: center; gap: 4px; }
.r-meta .lst { display: inline-flex; align-items: center; gap: 5px; }
.r-meta .lst i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.r-meta a { color: var(--accent); text-decoration: none; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-side { display: flex; gap: 2px; align-items: center; }
.flag-on { color: var(--flag); }
.sub-bar { height: 4px; border-radius: 2px; background: var(--surface-2); width: 60px; overflow: hidden; display: inline-block; }
.sub-bar i { display: block; height: 100%; background: var(--ok); }

.empty { text-align: center; padding: 56px 20px; color: var(--muted); max-width: 440px; margin: 0 auto; }
.empty h3 { font: 700 20px var(--font-display); color: var(--fg); margin: 12px 0 6px; }
.empty p { margin: 0 0 16px; }
.empty .art { width: 72px; height: 72px; margin: 0 auto; border-radius: 22px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }

/* Bulk bar */
.bulk { display: flex; align-items: center; gap: 8px; padding: 8px 24px; background: var(--accent-soft); border-block: 1px solid var(--line); flex-wrap: wrap; font-size: 14px; }
.bulk .grow { flex: 1; }

/* Calendar */
.cal-head { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
.cal-head h3 { font: 700 20px var(--font-display); margin: 0; flex: 1; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--line); gap: 1px; }
.cal .dow { background: var(--surface-2); text-align: center; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 0; font-weight: 600; }
.cal .day { background: var(--surface); min-height: 96px; padding: 6px; border: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal .day.out { background: var(--bg); color: var(--faint); }
.cal .day.today .dn { background: var(--accent); color: var(--on-accent); }
.cal .day.picked { box-shadow: inset 0 0 0 2px var(--accent); }
.cal .dn { font: 500 12.5px var(--font-mono); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.cal .ev { font-size: 11.5px; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--accent); }
.cal .ev.ghost { opacity: .6; border-left-style: dashed; }
.cal .ev.done { text-decoration: line-through; opacity: .5; }
.cal .more { font-size: 11px; color: var(--muted); }
.day-panel { margin-top: 16px; }
.day-panel h4 { font: 700 16px var(--font-display); margin: 0 0 8px; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 4px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat .k { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.stat .v { font: 700 34px/1.1 var(--font-display); margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 13px; color: var(--faint); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; }
.panel h4 { margin: 0 0 12px; font: 700 16px var(--font-display); }
.bars { display: grid; grid-template-columns: repeat(14, minmax(0,1fr)); gap: 6px; align-items: end; height: 150px; }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.bar i { display: block; width: 100%; max-width: 28px; background: var(--accent); border-radius: 4px 4px 1px 1px; min-height: 2px; }
.bar.today i { background: var(--ok); }
.bar span { font: 11px var(--font-mono); color: var(--faint); }
.bar b { font: 500 11px var(--font-mono); color: var(--muted); }
.hbar { display: grid; grid-template-columns: minmax(80px, 140px) minmax(0,1fr) 40px; gap: 10px; align-items: center; font-size: 13.5px; padding: 4px 0; }
.hbar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; border-radius: 5px; }
.hbar .num { text-align: right; font-family: var(--font-mono); color: var(--muted); }
.heat { display: grid; grid-template-columns: repeat(24, minmax(0,1fr)); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--accent); max-width: 100%; }
.heat-l { display: flex; justify-content: space-between; font: 11px var(--font-mono); color: var(--faint); margin-top: 6px; }

/* Editor */
.editor { width: 400px; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.editor[hidden] { display: none !important; }
.ed-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.ed-head .grow { flex: 1; font-weight: 600; color: var(--muted); font-size: 13.5px; }
.ed-body { overflow-y: auto; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.ed-body > *, .side-scroll > * { flex-shrink: 0; }
.ed-title { font: 700 22px/1.25 var(--font-display); border: 0; background: transparent; width: 100%; resize: none; padding: 0; outline: none; }
.ed-notes { border: 1px solid var(--line); border-radius: 9px; background: var(--bg); width: 100%; min-height: 70px; padding: 8px 10px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; }
.field input[type=text], .field input[type=url], .field input[type=date], .field input[type=time], .field input[type=number], .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.switch { position: relative; width: 40px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; inset: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 12px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(16px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.prio-seg { display: grid; grid-template-columns: repeat(4, 1fr); }
.prio-seg button { justify-content: center; }
.quick-dates { display: flex; flex-wrap: wrap; gap: 6px; }
.subtasks { display: flex; flex-direction: column; gap: 4px; }
.sub { display: flex; align-items: center; gap: 8px; }
.sub input[type=text] { flex: 1; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 3px 0; min-width: 0; }
.sub input[type=text]:focus { border-bottom-color: var(--line); outline: none; }
.sub.done input[type=text] { text-decoration: line-through; color: var(--faint); }
.sub input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); }
.ed-foot { font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tag-input { display: flex; flex-wrap: wrap; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; background: var(--bg); }
.tag-input input { border: 0; background: transparent; flex: 1; min-width: 80px; outline: none; padding: 2px; }
.chip .x { border: 0; background: transparent; padding: 0; color: inherit; line-height: 1; }
.hist { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; font-family: var(--font-mono); }

/* Alerts, toasts, modals */
.alerts { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); right: 14px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; z-index: 50; width: min(360px, calc(100vw - 28px)); }
.alert { pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 8px; animation: slide .25s ease; border-top: 4px solid var(--accent); }
.alert .a-top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.alert .a-kind { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.alert .a-time { font: 12px var(--font-mono); color: var(--muted); }
.alert .a-title { font: 700 17px/1.25 var(--font-display); overflow-wrap: anywhere; }
.alert .a-actions { display: flex; flex-wrap: wrap; gap: 6px; }
@keyframes slide { from { transform: translateY(-8px); opacity: 0; } }
@media (min-width: 761px) { body.editing .alerts { right: 414px; } }
@media (min-width: 761px) and (max-width: 1100px) { body.editing .alerts { right: 434px; } }
.toasts { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; align-items: center; width: max-content; max-width: calc(100vw - 32px); }

const LS_KEY = 'nudge.reminders.v1';
const Store = {
  mode: 'memory', db: null, uid: null, status: 'idle', queue: new Map(),
  profileRef() { return this.db.doc(`data/users/${this.uid}/profile`); },
  remCol() { return this.profileRef().collection('reminders'); },
  async init() {
    let db = null, user = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch {}
    }
    let id = null;
    if (db && user) { try { id = await user.id(); } catch {} }
    if (db && id) {
      this.mode = 'cloud'; this.db = db; this.uid = id;
      await new Promise((resolve) => {
        let gotP = false, gotR = false;
        const done = () => { if (gotP && gotR) resolve(); };
        this.profileRef().onSnapshot((snap) => {
          if (snap.exists && !this.queue.has('profile')) {
            const d = clone(snap.data());
            if (Array.isArray(d.lists) && d.lists.length) S.lists = d.lists;
            Object.assign(S.settings, DEFAULT_SETTINGS, d.settings || {});
            S.log = Array.isArray(d.log) ? d.log : [];
            if (Array.isArray(d.templates)) S.templates = d.templates;
            if (Array.isArray(d.focusLog)) S.focusLog = d.focusLog;
          }
          if (!gotP) { gotP = true; done(); } else onRemoteChange();
        }, () => this.setStatus('err'));
        this.remCol().onSnapshot((qs) => {
          const next = {};
          for (const doc of qs.docs) next[doc.id] = clone(doc.data());
          for (const [k] of this.queue) if (k.startsWith('r:')) { const rid = k.slice(2); if (S.reminders[rid]) next[rid] = S.reminders[rid]; else delete next[rid]; }
          S.reminders = next;
          if (!gotR) { gotR = true; done(); } else onRemoteChange();
        }, () => this.setStatus('err'));
        setTimeout(() => { gotP = gotR = true; resolve(); }, 8000);
      });
      this.setStatus('ok');
    } else {
      this.mode = (() => { try { localStorage.setItem('__nudge_probe', '1'); localStorage.removeItem('__nudge_probe'); return true; } catch { return false; } })() ? 'local' : 'memory';
      const raw = lsGet(LS_KEY);
      if (raw) {
        try {
          const d = JSON.parse(raw);
          if (Array.isArray(d.lists) && d.lists.length) S.lists = d.lists;
          S.reminders = d.reminders || {};
          S.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
          S.log = d.log || [];
          if (Array.isArray(d.templates)) S.templates = d.templates;
          if (Array.isArray(d.focusLog)) S.focusLog = d.focusLog;
        } catch {}
      }
      this.setStatus(this.mode === 'local' ? 'ok' : 'idle');
    }
  },
  setStatus(s) { this.status = s; renderSync(); },
  saveLocal() {
    clearTimeout(this._lt);
    this._lt = setTimeout(() => lsSet(LS_KEY, JSON.stringify({ lists: S.lists, reminders: S.reminders, settings: S.settings, log: S.log, templates: S.templates, focusLog: S.focusLog })), 150);
  },
  enqueue(key, run) {
    const entry = this.queue.get(key) || { busy: false, dirty: false, timer: null, run };
    entry.run = run;
    this.queue.set(key, entry);
    if (entry.busy) { entry.dirty = true; return; }
    clearTimeout(entry.timer);
    entry.timer = setTimeout(() => this.flush(key), 350);
    this.setStatus('busy');
  },
  async flush(key) {
    const entry = this.queue.get(key); if (!entry) return;
    entry.busy = true; entry.dirty = false;
    try { await entry.run(); this._err = false; }
    catch (e) {
      this._err = true;
      this.setStatus('err');
      toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete old completed reminders to free space.' : 'Couldn’t save your last change. Check your connection; it will retry on your next edit.');
    }
    entry.busy = false;
    if (entry.dirty) { entry.dirty = false; return this.flush(key); }
    this.queue.delete(key);
    if (!this.queue.size) this.setStatus(this._err ? 'err' : 'ok');
  },
  saveReminder(id) {
    if (this.mode === 'cloud') {
      this.enqueue('r:' + id, async () => {
        const r = S.reminders[id];
        const ref = this.remCol().doc(id);
        if (r) await ref.set(clone(r)); else await ref.delete();

  },
  saveProfile() {

  },
};

/* ---------- Reminder model ---------- */
function newReminder(p = {}) {
  const now = Date.now();
  return {
    id: uid(), title: '', notes: '', listId: currentListId() || S.lists[0]?.id || 'personal',
    due: null, allDay: false, repeat: null, early: S.settings.defaultEarly || 0,
    priority: 0, flagged: false, tags: [], subtasks: [], url: '', location: '',
    done: false, doneAt: null, createdAt: now, updatedAt: now,
    order: -now, lastFired: 0, snoozedUntil: null, history: [], estimate: 0, deletedAt: null, ...p,
  };
}
function currentListId() { return UI.view.startsWith('list:') ? UI.view.slice(5) : null; }
function allDayMs(t) { const [h, m] = (S.settings.allDayTime || '09:00').split(':').map(Number); const d = new Date(t); d.setHours(h, m, 0, 0); return d.getTime(); }
function effectiveDue(r) { return r.due == null ? null : (r.allDay ? allDayMs(r.due) : r.due); }
function listById(id) { return S.lists.find(l => l.id === id); }
function update(id, patch, opts = {}) {
  const r = S.reminders[id]; if (!r) return;
  const before = { due: r.due, allDay: r.allDay, early: r.early };
  Object.assign(r, patch, { updatedAt: Date.now() });
  if (('due' in patch && patch.due !== before.due) || ('allDay' in patch && patch.allDay !== before.allDay) || ('early' in patch && patch.early !== before.early)) { r.lastFired = 0; r.snoozedUntil = null; }
  Store.saveReminder(id);
  if (!opts.silent) render();
}
function addReminder(p) {
  const r = newReminder(p);
  S.reminders[r.id] = r;
  Store.saveReminder(r.id);
  return r;
}

function nextOccurrence(t, rep) {
  const n = Math.max(1, rep.interval || 1);
  const d = new Date(t);
  switch (rep.freq) {
    case 'day': d.setDate(d.getDate() + n); break;
    case 'weekday': do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6); break;
    case 'week': d.setDate(d.getDate() + 7 * n); break;
    case 'month': { const day = rep.anchorDay || d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); break; }
    case 'year': { const day = d.getDate(), mo = d.getMonth(); d.setDate(1); d.setFullYear(d.getFullYear() + n); d.setMonth(mo); d.setDate(Math.min(day, new Date(d.getFullYear(), mo + 1, 0).getDate())); break; }
    case 'hour': d.setHours(d.getHours() + n); break;
    default: d.setDate(d.getDate() + 1);
  }
  return d.getTime();
}
function repeatLabel(rep) {
  if (!rep) return '';
  const n = rep.interval || 1;
  const unit = { day: 'day', week: 'week', month: 'month', year: 'year', hour: 'hour' }[rep.freq];
  let s = rep.freq === 'weekday' ? 'Every weekday' : n === 1 ? ({ day: 'Daily', week: 'Weekly', month: 'Monthly', year: 'Yearly', hour: 'Hourly' }[rep.freq]) : `Every ${n} ${unit}s`;
  if (rep.until) s += ` until ${fmtDate(new Date(rep.until + 'T00:00').getTime(), true)}`;
  return s;
}

function toggleDone(id, opts = {}) {
  const r = S.reminders[id]; if (!r) return;
  const prev = clone(r);
  if (!r.done) {
    const now = Date.now();
    S.log.push({ t: now, l: r.listId });
    if (S.log.length > 1500) S.log = S.log.slice(-1500);
    Store.saveProfile();
    if (r.repeat && r.due != null) {
      let next = nextOccurrence(r.due, r.repeat);
      let guard = 0;
      while (next < startOfDay(now) && guard++ < 1000) next = nextOccurrence(next, r.repeat);
      const until = r.repeat.until ? new Date(r.repeat.until + 'T23:59:59').getTime() : Infinity;
      r.history = [...(r.history || []), now].slice(-400);
      if (next > until) { r.done = true; r.doneAt = now; }
      else { r.due = next; r.subtasks = (r.subtasks || []).map(s => ({ ...s, done: false })); r.lastFired = 0; r.snoozedUntil = null; }
      r.updatedAt = now;
      Store.saveReminder(id);
      if (!opts.quiet) toast(r.done ? `Completed “${r.title}” (series ended)` : `Done. Next: ${fmtDue(r)}`, () => restore(prev));
    } else {
      r.done = true; r.doneAt = now; r.updatedAt = now;
      Store.saveReminder(id);
      if (!opts.quiet) toast(`Completed “${trunc(r.title, 40)}”`, () => restore(prev));
    }
    dismissAlert(id);
  } else {
    r.done = false; r.doneAt = null; r.updatedAt = Date.now();
    Store.saveReminder(id);
  }
  render();

function buildShell() {
  $('#app').innerHTML = `
  <div class="scrim" data-act="close-nav"></div>
  <aside class="side" aria-label="Lists">
    <div class="side-scroll">
      <div class="brand"><div class="brand-mark">${I.bell}</div><h1>Nudge</h1></div>
      <div class="smart" id="smart"></div>
      <div>
        <div class="sec-h"><span>My lists</span><button class="icon-btn" data-act="new-list" title="New list" aria-label="New list">${I.plus}</button></div>
        <nav class="nav" id="lists"></nav>
      </div>
      <div id="tagsSec">
        <div class="sec-h"><span>Tags</span></div>
        <div class="tags" id="tags"></div>
      </div>
      <div>
        <div class="sec-h"><span>Views</span></div>
        <nav class="nav">
          <button class="nav-item" data-act="mode" data-mode="board" id="navBoard"><span style="color:var(--muted)">${I.board}</span><span class="name">Board</span></button>
          <button class="nav-item" data-act="mode" data-mode="calendar" id="navCal"><span style="color:var(--muted)">${I.cal}</span><span class="name">Calendar</span></button>

          <button class="nav-item" data-act="view" data-view="trash" id="navTrash"><span style="color:var(--muted)">${I.trash}</span><span class="name">Recently deleted</span><span class="cnt" id="trashCnt"></span></button>

      </div>
      <button class="icon-btn" data-act="list-menu" id="listMenuBtn" title="More" aria-label="More options">${I.dots}</button>
    </div>
    <div class="bulk" id="bulk" hidden></div>
    <div class="toolbar" id="toolbar">
      <label for="sortSel">Sort <select id="sortSel"><option value="due">Due date</option><option value="priority">Priority</option><option value="created">Newest</option><option value="title">Title</option><option value="manual">Manual (drag)</option></select></label>
      <label for="groupSel">Group <select id="groupSel"><option value="date">By date</option><option value="priority">By priority</option><option value="list">By list</option><option value="none">None</option></select></label>
      <label for="showDone"><input type="checkbox" id="showDone"> Show completed</label>

function render() {
  if (!shellBuilt) return;
  renderSide();
  renderMain();
  if (UI.editing && !S.reminders[UI.editing]) closeEditor();
  document.title = (() => { const n = all().filter(r => isOverdue(r)).length + alertQueue.length; return n ? `(${n}) Nudge Reminders` : 'Nudge Reminders'; })();
}

function renderSide() {
  const counts = {}; for (const k in SMART) counts[k] = 0;
  const listCounts = {};
  for (const r of all()) {
    for (const k in SMART) if (SMART[k].test(r)) counts[k]++;
    if (!r.done) listCounts[r.listId] = (listCounts[r.listId] || 0) + 1;
  }
  $('#smart').innerHTML = Object.entries(SMART).map(([k, v]) => `
    <button class="tile" data-act="view" data-view="${k}" aria-current="${UI.mode === 'list' && UI.view === k}">
      <span class="ico" style="background:${v.color}">${I[v.icon]}</span><span class="n">${counts[k]}</span><span class="lbl">${v.name}</span></button>`).join('');
  $('#lists').innerHTML = [...S.lists].sort((a, b) => a.order - b.order).map(l => `
    <button class="nav-item" data-act="view" data-view="list:${esc(l.id)}" data-list-drop="${esc(l.id)}" aria-current="${UI.mode === 'list' && UI.view === 'list:' + l.id}">
      <span class="dot" style="background:${esc(l.color)}"></span><span class="name">${esc(l.name)}</span><span class="cnt">${listCounts[l.id] || 0}</span></button>`).join('');
  const tags = allTags();
  $('#tagsSec').hidden = !tags.length;
  $('#tags').innerHTML = tags.map(([t, n]) => `<button class="chip" data-act="view" data-view="tag:${esc(t)}" aria-pressed="${UI.view === 'tag:' + t}">#${esc(t)} <span class="mono">${n}</span></button>`).join('');
  $('#navCal').setAttribute('aria-current', UI.mode === 'calendar');
  $('#navStats').setAttribute('aria-current', UI.mode === 'stats');
  $('#navBoard').setAttribute('aria-current', UI.mode === 'board');
  $('#navTrash').setAttribute('aria-current', UI.mode === 'list' && UI.view === 'trash');
  const tc = trashed().length; $('#trashCnt').textContent = tc || '';
}
function renderSync() {
  const dot = $('#syncDot'), txt = $('#syncText'); if (!dot) return;
  dot.className = 'sync-dot ' + ({ ok: 'ok', busy: 'busy', err: 'err' }[Store.status] || '');
  const where = Store.mode === 'cloud' ? 'your account' : Store.mode === 'local' ? 'this browser' : 'memory only';
  txt.textContent = Store.status === 'busy' ? 'Saving…' : Store.status === 'err' ? 'Not saved — retrying on next edit' : Store.mode === 'memory' ? 'Not saved (storage blocked)' : `Saved to ${where}`;
}

function renderMain() {
  const statsMode = UI.mode === 'stats', calMode = UI.mode === 'calendar';
  $('#viewTitle').textContent = statsMode ? 'Statistics' : calMode ? 'Calendar' : viewName();
  $('#modeList').setAttribute('aria-pressed', UI.mode === 'list');
  $('#modeCal').setAttribute('aria-pressed', calMode);
  $('#modeBoard').setAttribute('aria-pressed', UI.mode === 'board');
  $('#toolbar').hidden = UI.mode !== 'list' || UI.view === 'trash';
  $('#quick').hidden = statsMode || (UI.mode === 'list' && (UI.view === 'completed' || UI.view === 'trash'));
  $('#listMenuBtn').hidden = UI.mode !== 'list';
  $('#sortSel').value = S.settings.sort; $('#groupSel').value = S.settings.group; $('#showDone').checked = S.settings.showCompleted;
  $('#groupSel').disabled = S.settings.sort === 'manual';
  $('#selBtn').innerHTML = UI.selecting ? 'Done selecting' : `${I.select} Select`;
  const now = new Date();
  $('#viewSub').textContent = UI.mode === 'board' ? 'Board' : UI.mode === 'list' && UI.view === 'today' && !UI.query ? now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) : '';
  renderBulk();
  if (statsMode) return renderStats();
  if (calMode) return renderCalendar();
  if (UI.mode === 'board') return renderBoard();
  if (UI.view === 'trash') return renderTrash();
  renderList();
}

function rowHTML(r) {
  const l = listById(r.listId);
  const now = Date.now();
  const ed = effectiveDue(r);
  const over = isOverdue(r, now), soon = !over && ed != null && !r.done && ed - now < HOUR && ed > now;
  const subDone = (r.subtasks || []).filter(s => s.done).length, subN = (r.subtasks || []).length;
  const meta = [];
  if (r.due != null && !r.done) meta.push(`<span class="due ${over ? 'over' : soon ? 'soon' : ''}">${esc(fmtDue(r))}${!r.allDay ? ` · ${relative(r.due)}` : ''}</span>`);
  if (r.done && r.doneAt) meta.push(`<span class="due">Done ${esc(fmtWhen(r.doneAt))}</span>`);
  if (r.snoozedUntil && r.snoozedUntil > now && !r.done) meta.push(`<span class="m">${I.alarm} snoozed to ${esc(fmtTime(r.snoozedUntil))}</span>`);
  if (r.repeat) meta.push(`<span class="m">${I.repeat} ${esc(repeatLabel(r.repeat))}</span>`);
  if (r.repeat && !r.done) { const st = streakOf(r); if (st >= 2) meta.push(`<span class="m streak">${I.spark} ${st}-${streakUnit(r)} streak</span>`); }
  if (r.estimate) meta.push(`<span class="m">${I.timer} ~${esc(fmtMins(r.estimate))}</span>`);
  if (focus && focus.rid === r.id) meta.push(`<span class="m streak">${I.timer} focusing</span>`);
  if (r.early) meta.push(`<span class="m">${I.alarm} ${esc(earlyLabel(r.early))}</span>`);
  if (!UI.view.startsWith('list:') && l) meta.push(`<span class="lst"><i style="background:${esc(l.color)}"></i>${esc(l.name)}</span>`);
  if (subN) meta.push(`<span class="m"><span class="sub-bar"><i style="width:${(subDone / subN) * 100}%"></i></span> ${subDone}/${subN}</span>`);
  if (r.location) meta.push(`<span class="m">${I.pin} ${esc(r.location)}</span>`);
  if (r.url) { const safe = /^https?:\/\//i.test(r.url) ? r.url : 'https://' + r.url; meta.push(`<a href="${esc(safe)}" target="_blank" rel="noopener" class="m">${I.link} ${esc(r.url.replace(/^https?:\/\//, ''))}</a>`); }
  for (const t of r.tags) meta.push(`<span class="chip">#${esc(t)}</span>`);
  const sel = UI.selected.has(r.id);
  return `<div class="row ${r.done ? 'is-done' : ''} ${sel ? 'sel' : ''}" data-id="${r.id}" draggable="${S.settings.sort === 'manual' || !UI.selecting}">
    <span class="grip" aria-hidden="true">${I.grip}</span>
    ${UI.selecting
      ? `<input type="checkbox" class="selbox" data-act="toggle-sel" aria-label="Select ${esc(r.title)}" ${sel ? 'checked' : ''} style="width:20px;height:20px;margin:2px;accent-color:var(--accent)">`
      : `<button class="check p${r.priority} ${r.done ? 'done' : ''}" data-act="toggle" aria-label="${r.done ? 'Mark not done' : 'Complete'}: ${esc(r.title)}">${I.done}</button>`}
    <div class="r-main" data-act="edit">
      <div class="r-title">${r.priority ? `<span class="prio">${'!'.repeat(r.priority)}</span>` : ''}${esc(r.title || 'Untitled')}</div>
      ${r.notes ? `<div class="r-notes">${esc(r.notes)}</div>` : ''}
      ${meta.length ? `<div class="r-meta">${meta.join('')}</div>` : ''}
    </div>
    <div class="r-side">
      <button class="icon-btn ${r.flagged ? 'flag-on' : ''}" data-act="flag" title="${r.flagged ? 'Unflag' : 'Flag'}" aria-label="${r.flagged ? 'Unflag' : 'Flag'}">${r.flagged ? I.flag : I.flagO}</button>
      <button class="icon-btn" data-act="row-menu" title="More" aria-label="More actions">${I.dots}</button>
    </div>
  </div>`;
}

function renderList() {
  const items = currentItems();
  visibleIds.length = 0;
  const groups = groupItems(items);
  for (const g of groups) for (const r of g.rows) visibleIds.push(r.id);
  const c = $('#content');
  c.classList.toggle('manual', S.settings.sort === 'manual');
  const head = (UI.view === 'today' || UI.view === 'overdue') && !UI.query ? upNextHTML() : '';
  if (!items.length) {
    const empty = !all().length;
    c.innerHTML = head + `<div class="empty"><div class="art">${I.bell}</div>
      <h3>${UI.query ? 'No matches' : empty ? 'Nothing to remember yet' : UI.view === 'overdue' ? 'Nothing overdue' : UI.view === 'today' ? 'Today is clear' : 'All clear here'}</h3>
      <p>${UI.query ? `No reminders match “${esc(UI.query)}”.` : empty ? 'Type a reminder above in plain English. Nudge picks out the date, time, repeat, priority and tags for you.' : 'Add something above, or pick another list.'}</p>
      ${empty && !UI.query ? '<button class="btn" data-act="load-examples">Load example reminders</button>' : ''}</div>`;
    return;
  }
  c.innerHTML = head + groups.map(g => `<section class="group">
    ${g.name ? `<div class="group-h ${g.cls || ''}">${esc(g.name)} <span class="n">${g.rows.length}</span></div>` : ''}
    <div class="rows">${g.rows.map(rowHTML).join('')}</div></section>`).join('')
    + (UI.view === 'completed' ? `<div style="margin-top:16px"><button class="btn danger" data-act="clear-completed">Clear all completed</button></div>` : '');
  if (UI.kbIndex >= 0) markKb();
}

function renderBulk() {
  const b = $('#bulk');
  b.hidden = !UI.selecting || UI.mode !== 'list';
  if (b.hidden) return;
  const n = UI.selected.size;
  b.innerHTML = `<strong>${n} selected</strong><span class="grow"></span>
    <button class="btn small" data-act="sel-all">Select all</button>
    <button class="btn small" data-act="bulk-done" ${n ? '' : 'disabled'}>Complete</button>
    <button class="btn small" data-act="bulk-flag" ${n ? '' : 'disabled'}>Flag</button>
    <button class="btn small" data-act="bulk-date" ${n ? '' : 'disabled'}>Reschedule…</button>
    <button class="btn small" data-act="bulk-move" ${n ? '' : 'disabled'}>Move…</button>
    <button class="btn small danger" data-act="bulk-delete" ${n ? '' : 'disabled'}>Delete</button>`;
}

/* Calendar */
function occurrencesBetween(r, from, to) {
  const out = [];
  if (r.due == null) return out;
  let t = r.due, i = 0;
  if (t >= from && t < to) out.push({ t, ghost: false });
  if (!r.repeat || r.done) return out;
  const until = r.repeat.until ? new Date(r.repeat.until + 'T23:59:59').getTime() : Infinity;
  while (i++ < 400) {
    t = nextOccurrence(t, r.repeat);
    if (t >= to || t > until) break;
    if (t >= from) out.push({ t, ghost: true });
  }
  return out;
}
function renderCalendar() {
  const m = new Date(UI.calMonth); m.setDate(1);
  const first = m.getTime();
  const ws = S.settings.weekStart;
  let start = first; while (new Date(start).getDay() !== ws) start = addDays(start, -1);
  const end = addDays(start, 42);
  const byDay = new Map();
  for (const r of all()) {
    if (UI.query && !matchesQuery(r, UI.query)) continue;
    for (const o of occurrencesBetween(r, start, end)) { const k = startOfDay(o.t); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push({ r, ...o }); }
    if (r.done && r.doneAt && r.due == null && r.doneAt >= start && r.doneAt < end) { /* undated completions not shown */ }
  }
  const today = startOfDay(Date.now());
  let cells = '';
  for (let i = 0; i < 7; i++) cells += `<div class="dow">${DOWS[(ws + i) % 7].slice(0, 3)}</div>`;
  for (let d = start, i = 0; i < 42; i++, d = addDays(d, 1)) {
    const evs = (byDay.get(d) || []).sort((a, b) => (a.r.allDay ? -1 : 0) - (b.r.allDay ? -1 : 0) || a.t - b.t);
    const out = new Date(d).getMonth() !== m.getMonth();
    cells += `<button class="day ${out ? 'out' : ''} ${d === today ? 'today' : ''} ${d === UI.calPick ? 'picked' : ''}" data-act="cal-pick" data-day="${d}" aria-label="${new Date(d).toDateString()}, ${evs.length} reminders">
      <span class="dn">${new Date(d).getDate()}</span>
      ${evs.slice(0, 3).map(e => { const l = listById(e.r.listId); return `<span class="ev ${e.ghost ? 'ghost' : ''} ${e.r.done ? 'done' : ''}" style="border-left-color:${esc(l?.color || 'var(--accent)')}">${e.r.allDay ? '' : esc(S.settings.clock24 ? fmtTime(e.t) : fmtTime(e.t).replace(':00', '').replace(' ', '').toLowerCase()) + ' '}${esc(e.r.title)}</span>`; }).join('')}
      ${evs.length > 3 ? `<span class="more">+${evs.length - 3} more</span>` : ''}</button>`;
  }
  const pick = UI.calPick;
  const dayItems = (byDay.get(pick) || []);
  const realRows = dayItems.filter(e => !e.ghost).map(e => e.r);
  const ghosts = dayItems.filter(e => e.ghost);
  visibleIds.length = 0; realRows.forEach(r => visibleIds.push(r.id));
  $('#content').innerHTML = `
    <div class="cal-head"><h3>${m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</h3>
      <button class="btn small" data-act="cal-nav" data-d="-1" aria-label="Previous month">‹</button>
      <button class="btn small" data-act="cal-nav" data-d="0">Today</button>
      <button class="btn small" data-act="cal-nav" data-d="1" aria-label="Next month">›</button></div>
    <div class="cal">${cells}</div>
    <div class="day-panel"><h4>${esc(fmtDate(pick, false))} · ${new Date(pick).toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}</h4>
      ${realRows.length ? `<div class="rows">${realRows.map(rowHTML).join('')}</div>` : `<p class="note">No reminders on this day. Anything you add above while this day is picked lands here.</p>`}
      ${ghosts.length ? `<p class="note" style="margin-top:10px">Upcoming repeats: ${ghosts.map(g => `${esc(g.r.title)}${g.r.allDay ? '' : ' at ' + esc(fmtTime(g.t))}`).join(' · ')}</p>` : ''}
    </div>`;
}

/* Up next, board, trash */
function upNextHTML() {
  const now = Date.now(), open = all().filter(r => !r.done);
  const next = open.filter(r => r.due != null && !r.allDay && r.due > now).sort((a, b) => a.due - b.due)[0];
  const todayLeft = open.filter(r => isToday(r));
  const est = todayLeft.reduce((sum, r) => sum + (r.estimate || 0), 0);
  const over = open.filter(r => isOverdue(r)).length;
  if (!next && !todayLeft.length && !over) return '';
  return `<div class="upnext">
    ${next ? `<div class="un-main" data-id="${next.id}"><div class="un-k">Up next · <span class="mono">${esc(relative(next.due))}</span></div><div class="un-t" data-act="edit">${esc(next.title || 'Untitled')}</div><div class="un-s mono">${esc(fmtWhen(next.due))}${next.estimate ? ' · ~' + esc(fmtMins(next.estimate)) : ''}</div></div>`
      : `<div class="un-main"><div class="un-k">Up next</div><div class="un-t" style="cursor:default">Nothing else with a set time</div></div>`}
    <div class="un-side"><div class="un-stat"><b>${todayLeft.length}</b> left today${est ? ` · ~${esc(fmtMins(est))} estimated` : ''}</div>
      <div class="un-actions">${next ? `<button class="btn small" data-act="focus-start" data-rid="${next.id}">${I.timer} Focus</button>` : ''}${over ? `<button class="btn small primary" data-act="review">${I.review} Review ${over} overdue</button>` : ''}</div></div></div>`;
}
const BOARD_COLS = [['overdue', 'Overdue'], ['today', 'Today'], ['tomorrow', 'Tomorrow'], ['week', 'Next 7 days'], ['later', 'Later'], ['none', 'Someday']];
function boardCol(r, today) {
  if (r.due == null) return 'none';
  if (isOverdue(r)) return 'overdue';
  if (r.due < addDays(today, 1)) return 'today';
  if (r.due < addDays(today, 2)) return 'tomorrow';
  if (r.due < addDays(today, 7)) return 'week';
  return 'later';
}
function colDue(k) { const t = startOfDay(Date.now()); return { today: t, tomorrow: addDays(t, 1), week: addDays(t, 2), later: addDays(t, 7), none: null }[k]; }
function renderBoard() {
  const saved = UI.view;
  if (saved === 'completed' || saved === 'trash') UI.view = 'all';
  const items = currentItems().filter(r => !r.done);
  UI.view = saved;
  const today = startOfDay(Date.now());
  const cols = Object.fromEntries(BOARD_COLS.map(([k]) => [k, []]));
  for (const r of items) cols[boardCol(r, today)].push(r);
  visibleIds.length = 0;
  const c = $('#content'); c.classList.remove('manual');
  c.innerHTML = `<p class="note" style="margin:0 0 10px">Drag a card to another column to reschedule it. Reminders with a time keep their time.</p>
    <div class="board">${BOARD_COLS.map(([k, n]) => (k === 'overdue' && !cols[k].length) ? '' : `<section class="col ${k === 'overdue' ? 'col-over' : ''}" data-col="${k}" aria-label="${n}">
      <div class="col-h">${n} <span class="n">${cols[k].length}</span></div>
      <div class="col-body">${cols[k].map(cardHTML).join('') || `<div class="col-empty">${k === 'overdue' ? '' : 'Drop a card here'}</div>`}</div></section>`).join('')}</div>`;
}
function cardHTML(r) {
  const l = listById(r.listId);
  visibleIds.push(r.id);
  const subN = (r.subtasks || []).length;
  return `<div class="card" data-id="${r.id}" draggable="true" style="border-left-color:${esc(l?.color || 'var(--line)')}">
    <div class="card-top"><button class="check p${r.priority}" data-act="toggle" aria-label="Complete: ${esc(r.title)}">${I.done}</button>
      <div class="card-t" data-act="edit">${r.priority ? `<span class="prio">${'!'.repeat(r.priority)}</span>` : ''}${esc(r.title || 'Untitled')}</div>
      <button class="icon-btn" data-act="row-menu" aria-label="More actions">${I.dots}</button></div>
    <div class="r-meta">${r.due != null ? `<span class="due ${isOverdue(r) ? 'over' : ''}">${esc(fmtDue(r))}</span>` : ''}${r.flagged ? `<span class="flag-on">${I.flag}</span>` : ''}${r.repeat ? `<span class="m" title="${esc(repeatLabel(r.repeat))}">${I.repeat}</span>` : ''}${r.estimate ? `<span class="m">~${esc(fmtMins(r.estimate))}</span>` : ''}${subN ? `<span class="m">${r.subtasks.filter(x => x.done).length}/${subN}</span>` : ''}</div></div>`;
}
function renderTrash() {
  const items = currentItems();
  visibleIds.length = 0;

}

function bindEditor() {
  const id = UI.editing; const r = () => S.reminders[id];

    openEditor(id);

    }
    openEditor(id);
  };
  $('#edRepeat').addEventListener('change', setRepeat);
  $('#edInterval').addEventListener('change', setRepeat);
  $('#edUntil').addEventListener('change', setRepeat);
  $('#edFlag').addEventListener('change', (e) => update(id, { flagged: e.target.checked }));

  }));

/* ---------- Alerts engine ---------- */
const alertQueue = [];

  const ed = effectiveDue(r);
  const c = [];

  else {
    if (r.early) c.push({ t: ed - r.early * MIN, kind: `Coming up · ${earlyLabel(r.early)}` });
    c.push({ t: ed, kind: 'Reminder' });
  }
  return c;
}
function tick() {
  const now = Date.now();
  for (const r of all()) {
    const pending = alertCandidates(r).filter(c => c.t <= now && c.t > (r.lastFired || 0) && now - c.t < 6 * HOUR);
    if (!pending.length) continue;
    const c = pending[pending.length - 1];
    r.lastFired = c.t; Store.saveReminder(r.id);
    fireAlert(r, c.kind);
  }
  if ((UI.mode === 'list' || UI.mode === 'board') && !UI.dragging && !document.querySelector('.menu') && !isTyping()) renderMain();
  renderSide();
}
function isTyping() { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'); }
function fireAlert(r, kind) {
  if (alertQueue.some(a => a.id === r.id)) dismissAlert(r.id, true);

  renderAlerts();
  chime();
  try {
    if ('Notification' in window && Notification.permission === 'granted') new Notification(r.title || 'Reminder', { body: fmtDue(r), tag: r.id });
  } catch {}

}
function dismissAlert(id, silent) {

}
function renderAlerts() {

    const r = S.reminders[a.id]; if (!r) return '';
    const l = listById(r.listId);
    return `<div class="alert" data-id="${r.id}" role="alertdialog" aria-label="Reminder: ${esc(r.title)}" style="border-top-color:${esc(l?.color || 'var(--accent)')}">
      <div class="a-top"><span class="a-kind">${esc(a.kind)}</span><span class="a-time">${esc(fmtDue(r))}</span></div>

      <div class="a-actions"><button class="btn small primary" data-act="al-done">Mark done</button>

        <button class="btn small" data-act="al-snooze" data-k="tomorrow">Tomorrow</button>

}
let audioCtx = null;
function chime() {

}

const FOCUS_KEY = 'nudge.focus.v1';

  [{ label: 'Cancel' }, { label: 'Start focus', primary: true, run: (root) => startFocus(rid, +root.querySelector('#fmLen [aria-pressed="true"]').dataset.m) }], (root) => {

  });
}
function startFocus(rid, mins) {
  const now = Date.now();
  focus = { rid, mins, startedAt: now, endsAt: now + mins * MIN, pausedLeft: null };
  if (S.settings.focusMinutes !== mins) { S.settings.focusMinutes = mins; Store.saveProfile(); }
  saveFocus(); runFocus(); render();
}
function runFocus() { clearInterval(focusTimer); if (focus) { focusTimer = setInterval(focusTick, 1000); focusTick(); } else renderFocus(); }

}

  if (used >= 1) { S.focusLog.push({ t: Date.now(), m: used, r: f.rid }); if (S.focusLog.length > 1000) S.focusLog = S.focusLog.slice(-1000); Store.saveProfile(); }
  renderFocus();

    <div class="f-info"><div class="f-k">${paused ? 'Paused' : 'Focusing'}</div><div class="f-t" data-id="${focus.rid}"><span data-act="edit" style="cursor:pointer">${esc(r ? r.title || 'Untitled' : 'Deleted reminder')}</span></div></div>

/* ---------- Review overdue ---------- */
function reviewOverdue() {
  const queue = all().filter(r => isOverdue(r)).sort((a, b) => a.due - b.due).map(r => r.id);
  if (!queue.length) { toast('Nothing is overdue.'); return; }
  let i = 0; const tally = { moved: 0, done: 0, deleted: 0, skipped: 0 };

    const body = root.querySelector('#rvBody');
    const draw = () => {
      while (i < queue.length && (!S.reminders[queue[i]] || S.reminders[queue[i]].deletedAt || S.reminders[queue[i]].done)) i++;
      if (i >= queue.length) {
        body.innerHTML = `<div class="rv-done"><div class="art">${I.done}</div><h4>All caught up</h4><p class="note" style="margin:0">${tally.moved} rescheduled · ${tally.done} completed · ${tally.deleted} deleted · ${tally.skipped} skipped</p></div>`;
        return;
      }

      body.innerHTML = `<div class="rv-prog">${i + 1} of ${queue.length}</div><div class="rv-bar"><i style="width:${(i / queue.length) * 100}%"></i></div>
        <div class="rv-card"><div class="rv-t">${r.priority ? `<span class="prio">${'!'.repeat(r.priority)}</span>` : ''}${esc(r.title || 'Untitled')}</div>
          <div class="r-meta"><span class="due over">${esc(fmtDue(r))} · ${esc(relative(effectiveDue(r)))}</span>${l ? `<span class="lst"><i style="background:${esc(l.color)}"></i>${esc(l.name)}</span>` : ''}${r.repeat ? `<span class="m">${I.repeat} ${esc(repeatLabel(r.repeat))}</span>` : ''}</div>
          ${r.notes ? `<p class="note">${esc(trunc(r.notes, 160))}</p>` : ''}</div>
        <div class="note" style="margin:0">Move it to</div>
        <div class="rv-actions"><button class="btn primary" data-rv="today">Today</button><button class="btn" data-rv="tomorrow">Tomorrow</button><button class="btn" data-rv="weekend">Weekend</button><button class="btn" data-rv="nextweek">Next week</button><button class="btn" data-rv="none">No date</button></div>
        <div class="rv-actions"><button class="btn" data-rv="done">${I.done} Mark done</button><button class="btn danger" data-rv="delete">Delete</button><button class="btn" data-rv="skip">Skip</button></div>`;
      body.querySelector('[data-rv="today"]').focus();

/* ---------- Habits ---------- */
function streakOf(r) {
  const h = r.history || [];
  if (!r.repeat || !h.length) return 0;
  const f = r.repeat.freq;
  if (f === 'day' || f === 'weekday') {
    const days = new Set(h.map(startOfDay));
    let d = startOfDay(Date.now()), n = 0, guard = 0;
    if (!days.has(d)) d = addDays(d, -1);
    while (guard++ < 800) {
      const dow = new Date(d).getDay();
      if (f === 'weekday' && (dow === 0 || dow === 6)) { d = addDays(d, -1); continue; }
      if (!days.has(d)) break;
      n++; d = addDays(d, -1);
    }
    return n;
  }
  if (f === 'week') {
    const wk = (t) => { let d = startOfDay(t); while (new Date(d).getDay() !== S.settings.weekStart) d = addDays(d, -1); return d; };
    const weeks = new Set(h.map(wk)); let w = wk(Date.now()), n = 0;
    if (!weeks.has(w)) w = addDays(w, -7);
    while (weeks.has(w)) { n++; w = addDays(w, -7); }
    return n;
  }
  if (f === 'month') {
    const key = (t) => { const d = new Date(t); return d.getFullYear() * 12 + d.getMonth(); };
    const ms = new Set(h.map(key)); let m = key(Date.now()), n = 0;
    if (!ms.has(m)) m--;
    while (ms.has(m)) { n++; m--; }
    return n;
  }
  return 0;
}
const streakUnit = (r) => ({ week: 'week', month: 'month' }[r.repeat?.freq] || 'day');
function habitHTML(r) {
  const hist = r.history || [];
  if (!['day', 'weekday'].includes(r.repeat.freq) && !hist.length) return '';
  const days = new Set(hist.map(startOfDay)), today = startOfDay(Date.now()), cells = [];
  for (let i = 13; i >= 0; i--) { const d = addDays(today, -i); cells.push(`<i class="${days.has(d) ? 'on' : ''} ${d === today ? 'today' : ''}" title="${new Date(d).toDateString()}${days.has(d) ? ': done' : ''}"></i>`); }
  const st = streakOf(r);
  return `<div class="field"><span>Habit · last 14 days</span><div class="habit" role="img" aria-label="${hist.filter(t => t >= addDays(today, -13)).length} completions in the last 14 days">${cells.join('')}</div>
    <div class="note">${st ? `${st}-${streakUnit(r)} streak` : 'No current streak'} · ${hist.length} completed in total</div></div>`;
}

/* ---------- Ask Claude ---------- */
async function aiSteps(btn) {

  btn.disabled = true; btn.innerHTML = `${I.ai} Thinking…`;
  try {
    const steps = await AI.sample.json(`Break this to-do into 3 to 7 short, concrete checklist steps, in the order you would do them. Each step is under 60 characters and starts with a verb. Leave out steps that are already listed.
Task: ${JSON.stringify(r.title)}
Notes: ${JSON.stringify(r.notes || '')}
Already listed: ${JSON.stringify((r.subtasks || []).map(x => x.title))}
Reply with only a JSON array of strings.`, { modelTier: 'quick' });
    const list = (Array.isArray(steps) ? steps : []).filter(x => typeof x === 'string' && x.trim()).slice(0, 7).map(x => x.trim().slice(0, 120));
    const cur = S.reminders[id];
    if (!list.length) toast('No steps came back. Try a more specific title.');

  } catch (e) {

  }
  if (UI.editing === id) openEditor(id);
}

/* ---------- Import / export ---------- */
async function saveFile(filename, data, mime) {
  let dl = null;
  if (window.claude?.use) { try { dl = await window.claude.use('downloads'); } catch {} }
  if (dl) {
    try { await dl.save({ filename, data }); return; }
    catch (e) { if (e?.code === 'cancelled' || e?.code === 'declined') return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch { toast('Saving files isn’t available here.'); }
}
function exportJSON() {
  saveFile(`nudge-backup-${isoDate(Date.now())}.json`, JSON.stringify({ app: 'nudge', version: 1, exportedAt: new Date().toISOString(), lists: S.lists, reminders: all(), settings: S.settings, log: S.log }, null, 2), 'application/json');
}
function exportICS() {
  const z = (t) => { const d = new Date(t); return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`; };
  const dOnly = (t) => isoDate(t).replace(/-/g, '');
  const icsEsc = (s) => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Nudge//Reminders//EN', 'CALSCALE:GREGORIAN'];
  for (const r of all()) {
    if (r.due == null || r.done) continue;
    lines.push('BEGIN:VEVENT', `UID:${r.id}@nudge`, `DTSTAMP:${z(Date.now())}`, `SUMMARY:${icsEsc(r.title)}`);
    if (r.allDay) lines.push(`DTSTART;VALUE=DATE:${dOnly(r.due)}`, `DTEND;VALUE=DATE:${dOnly(addDays(r.due, 1))}`);
    else lines.push(`DTSTART:${z(r.due)}`, `DTEND:${z(r.due + 30 * MIN)}`);
    if (r.notes) lines.push(`DESCRIPTION:${icsEsc(r.notes)}`);
    if (r.location) lines.push(`LOCATION:${icsEsc(r.location)}`);
    if (r.url) lines.push(`URL:${icsEsc(r.url)}`);
    if (r.repeat) {
      const f = { day: 'DAILY', week: 'WEEKLY', month: 'MONTHLY', year: 'YEARLY', hour: 'HOURLY', weekday: 'WEEKLY' }[r.repeat.freq];
      let rule = `RRULE:FREQ=${f}`;
      if (r.repeat.freq === 'weekday') rule += ';BYDAY=MO,TU,WE,TH,FR'; else if ((r.repeat.interval || 1) > 1) rule += `;INTERVAL=${r.repeat.interval}`;
      if (r.repeat.until) rule += `;UNTIL=${r.repeat.until.replace(/-/g, '')}T235959Z`;
      lines.push(rule);
    }
    lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(r.title)}`, `TRIGGER:-PT${r.early || 0}M`, 'END:VALARM', 'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  saveFile(`nudge-${isoDate(Date.now())}.ics`, lines.join('\r\n'), 'text/calendar');
}
function importJSON(text) {
  let d; try { d = JSON.parse(text); } catch { toast('That file isn’t valid JSON.'); return; }
  if (!d || !Array.isArray(d.reminders)) { toast('That file isn’t a Nudge backup.'); return; }
  let added = 0;
  if (Array.isArray(d.lists)) for (const l of d.lists) if (l && l.id && !listById(l.id)) S.lists.push({ id: String(l.id), name: String(l.name || 'Imported'), color: String(l.color || '#6b7280'), order: S.lists.length });
  for (const r of d.reminders) {
    if (!r || !r.id || typeof r.title !== 'string') continue;
    const clean = newReminder({ ...r, tags: Array.isArray(r.tags) ? r.tags.map(String) : [], subtasks: Array.isArray(r.subtasks) ? r.subtasks : [] });
    clean.id = String(r.id);
    if (!listById(clean.listId)) clean.listId = S.lists[0].id;
    S.reminders[clean.id] = clean; Store.saveReminder(clean.id); added++;
  }
  if (Array.isArray(d.log)) { const seen = new Set(S.log.map(x => x.t)); for (const x of d.log) if (x && typeof x.t === 'number' && !seen.has(x.t)) S.log.push(x); S.log.sort((a, b) => a.t - b.t); }
  Store.saveProfile(); render(); toast(`Imported ${added} reminder${added === 1 ? '' : 's'}.`);
}
function resetAll() {
  for (const id of Object.keys(S.reminders)) { delete S.reminders[id]; Store.saveReminder(id); }
  S.log = []; Store.saveProfile(); UI.view = 'today'; closeEditor(); render(); toast('Everything was deleted.');
}

/* ---------- Theme ---------- */
function applyTheme() {
  const root = document.documentElement;
  const t = S.settings.theme;
  if (t === 'system') root.removeAttribute('data-app-theme'); else root.setAttribute('data-app-theme', t);
  const a = ACCENTS[S.settings.accent] || ACCENTS.cobalt;
  const dark = t === 'dark' || (t === 'system' && (root.getAttribute('data-theme') === 'dark' || (root.getAttribute('data-theme') !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)));
  root.style.setProperty('--accent', dark ? a[1] : a[0]);
  root.style.setProperty('--accent-soft', dark ? a[3] : a[2]);
}

/* ---------- Event wiring ---------- */
function bindShell() {
  const app = $('#app');
  app.addEventListener('click', onClick);
  $('#alerts').addEventListener('click', onClick);
  $('#focus').addEventListener('click', onClick);
  $('#search').addEventListener('input', (e) => { UI.query = e.target.value.trim(); UI.kbIndex = -1; renderMain(); });
  $('#search').addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.target.value = ''; UI.query = ''; renderMain(); e.target.blur(); } });
  $('#sortSel').addEventListener('change', (e) => { S.settings.sort = e.target.value; Store.saveProfile(); render(); });
  $('#groupSel').addEventListener('change', (e) => { S.settings.group = e.target.value; Store.saveProfile(); render(); });
  $('#showDone').addEventListener('change', (e) => { S.settings.showCompleted = e.target.checked; Store.saveProfile(); render(); });
  const qi = $('#quickInput');
  qi.addEventListener('input', () => {
    const v = qi.value.trim();
    const p = v ? parseQuick(v) : null;
    $('#quickPreview').innerHTML = p ? p.chips.map(([ic, t]) => `<span class="chip">${I[ic] || ''}${esc(t)}</span>`).join('') : '';
    $('#quickHint').hidden = !!v;
  });
  qi.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); quickAdd(e.shiftKey); } if (e.key === 'Escape') { qi.value = ''; qi.dispatchEvent(new Event('input')); qi.blur(); } });

  // Drag & drop: reorder (manual sort) and drop onto a list in the sidebar
  let dragId = null;
  app.addEventListener('dragstart', (e) => { const row = e.target.closest('.row[draggable], .card'); if (!row) return; dragId = row.dataset.id; UI.dragging = true; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch {} });
  app.addEventListener('dragend', () => { dragId = null; UI.dragging = false; document.querySelectorAll('.dragging,.drop-before,.drop').forEach(el => el.classList.remove('dragging', 'drop-before', 'drop')); });
  app.addEventListener('dragover', (e) => {
    if (!dragId) return;
    const navT = e.target.closest('[data-list-drop]');
    const row = e.target.closest('.row');
    const col = e.target.closest('[data-col]');
    document.querySelectorAll('.drop-before,.drop').forEach(el => el.classList.remove('drop-before', 'drop'));
    if (navT) { e.preventDefault(); navT.classList.add('drop'); }
    else if (col && col.dataset.col !== 'overdue') { e.preventDefault(); col.classList.add('drop'); }
    else if (row && S.settings.sort === 'manual' && row.dataset.id !== dragId) { e.preventDefault(); row.classList.add('drop-before'); }
  });
  app.addEventListener('drop', (e) => {
    if (!dragId) return; e.preventDefault();
    const navT = e.target.closest('[data-list-drop]');
    if (navT) { update(dragId, { listId: navT.dataset.listDrop }); toast(`Moved to ${listById(navT.dataset.listDrop).name}`); return; }
    const col = e.target.closest('[data-col]');
    if (col && col.dataset.col !== 'overdue') {
      const id = dragId, k = col.dataset.col;
      rescheduleOne(id, colDue(k), true); render();
      const r = S.reminders[id];
      toast(r.due == null ? 'Moved to Someday (no date)' : `Rescheduled to ${fmtDue(r)}`);
      return;
    }
    const row = e.target.closest('.row'); if (!row || S.settings.sort !== 'manual') return;
    const ids = visibleIds.filter(x => x !== dragId);
    const idx = ids.indexOf(row.dataset.id);
    ids.splice(idx, 0, dragId);
    ids.forEach((id, i) => { if (S.reminders[id].order !== i) { S.reminders[id].order = i; Store.saveReminder(id); } });
    render();
  });

  $('#importFile').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => importJSON(String(rd.result)); rd.readAsText(f); e.target.value = '';
  });
  document.addEventListener('keydown', onKey);
  document.addEventListener('click', (e) => { if (!e.target.closest('.menu') && !e.target.closest('[data-act="row-menu"],[data-act="list-menu"]')) closeMenu(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

function quickAdd(openAfter) {
  const qi = $('#quickInput'); const v = qi.value.trim(); if (!v) return;
  const p = parseQuick(v);
  const patch = { title: p.title || v, tags: p.tags, priority: p.priority, flagged: p.flagged || UI.view === 'flagged', due: p.due, allDay: p.allDay, repeat: p.repeat };
  if (p.early != null) patch.early = p.early;
  if (p.listId) patch.listId = p.listId;
  if (UI.view.startsWith('tag:') && !patch.tags.includes(UI.view.slice(4))) patch.tags.push(UI.view.slice(4));
  if (p.estimate) patch.estimate = p.estimate;
  if (patch.due == null) Object.assign(patch, defaultDueForView());
  const r = addReminder(patch);
  qi.value = ''; qi.dispatchEvent(new Event('input'));
  render();
  if (openAfter) openEditor(r.id);
  else toast(`Added “${trunc(r.title, 40)}”${r.due != null ? ' · ' + fmtDue(r) : ''}`, () => { delete S.reminders[r.id]; Store.saveReminder(r.id); render(); });
}

function onClick(e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  const holder = el.closest('[data-id]'); const id = holder?.dataset.id;
  const alertEl = el.closest('.alert'); const aid = alertEl?.dataset.id;
  if (audioCtx == null && S.settings.sound) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  switch (act) {
    case 'view': UI.view = el.dataset.view; UI.mode = 'list'; UI.selected.clear(); UI.kbIndex = -1; UI.navOpen = false; $('#app').classList.remove('nav-open'); render(); break;
    case 'mode': if (el.dataset.mode !== 'list' && (UI.view === 'trash' || UI.view === 'completed')) UI.view = 'all'; UI.mode = el.dataset.mode; UI.navOpen = false; $('#app').classList.remove('nav-open'); render(); break;
    case 'open-nav': $('#app').classList.add('nav-open'); break;
    case 'close-nav': $('#app').classList.remove('nav-open'); break;
    case 'new-list': listModal(null); break;
    case 'settings': settingsModal(); break;
    case 'shortcuts': shortcutsModal(); break;
    case 'quick-add': quickAdd(false); break;
    case 'templates': templatesModal(); break;
    case 'review': reviewOverdue(); break;
    case 'focus-start': focusModal(el.dataset.rid || id); break;
    case 'focus-pause': focusPause(); break;
    case 'focus-plus': focusPlus(); break;
    case 'focus-stop': finishFocus(false); break;
    case 'ed-tpl': saveAsTemplate(UI.editing); break;
    case 'ai-steps': aiSteps(el); break;
    case 'restore': undelete(id); render(); toast('Restored'); break;
    case 'purge': purge([id]); render(); toast('Deleted for good'); break;
    case 'restore-all': { const ids = trashed().map(r => r.id); ids.forEach(undelete); render(); toast(`Restored ${ids.length}`); break; }
    case 'empty-trash': { const ids = trashed().map(r => r.id); confirmDialog('Empty Recently deleted?', `Delete ${ids.length} reminder${ids.length === 1 ? '' : 's'} for good. This can’t be undone.`, 'Delete for good', () => { purge(ids); render(); toast('Recently deleted is empty'); }); break; }
    case 'toggle': el.classList.add('pop'); setTimeout(() => toggleDone(id), 160); break;
    case 'flag': update(id, { flagged: !S.reminders[id].flagged }); break;
    case 'edit': if (UI.selecting) { toggleSel(id); } else openEditor(id); break;
    case 'row-menu': rowMenu(el, id); break;
    case 'toggle-sel': toggleSel(id); break;
    case 'select-mode': UI.selecting = !UI.selecting; UI.selected.clear(); render(); break;
    case 'sel-all': visibleIds.forEach(x => UI.selected.add(x)); render(); break;
    case 'bulk-done': [...UI.selected].forEach(x => { if (!S.reminders[x].done) toggleDone(x, { quiet: true }); }); toast(`Completed ${UI.selected.size}`); UI.selected.clear(); render(); break;
    case 'bulk-flag': [...UI.selected].forEach(x => update(x, { flagged: true }, { silent: true })); render(); break;
    case 'bulk-move': moveModal([...UI.selected]); break;
    case 'bulk-date': rescheduleModal([...UI.selected]); break;
    case 'bulk-delete': removeReminders([...UI.selected]); break;
    case 'list-menu': listMenu(el); break;
    case 'load-examples': loadExamples(); break;
    case 'clear-completed': { const ids = all().filter(r => r.done).map(r => r.id); confirmDialog('Clear completed?', `Delete ${ids.length} completed reminder${ids.length === 1 ? '' : 's'}. Your statistics stay.`, 'Clear', () => removeReminders(ids)); break; }
    case 'cal-nav': { const d = +el.dataset.d; if (d === 0) { UI.calMonth = startOfDay(Date.now()); UI.calPick = UI.calMonth; } else { const m = new Date(UI.calMonth); m.setDate(1); m.setMonth(m.getMonth() + d); UI.calMonth = m.getTime(); } render(); break; }
    case 'cal-pick': UI.calPick = +el.dataset.day; if (new Date(UI.calPick).getMonth() !== new Date(UI.calMonth).getMonth()) UI.calMonth = UI.calPick; render(); break;
    // editor
    case 'ed-close': closeEditor(); break;
    case 'ed-delete': removeReminders([UI.editing]); break;
    case 'ed-dup': { const r = duplicate(UI.editing); openEditor(r.id); break; }
    case 'ed-q': update(UI.editing, quickDue(el.dataset.q)); openEditor(UI.editing); break;
    case 'ed-prio': update(UI.editing, { priority: +el.dataset.p }); openEditor(UI.editing); break;
    case 'ed-untag': update(UI.editing, { tags: S.reminders[UI.editing].tags.filter(t => t !== el.dataset.t) }); openEditor(UI.editing); break;
    case 'ed-snooze': { const rid = UI.editing; if (S.reminders[rid].due == null) { toast('Add a due date first, then snooze.'); break; } snooze(rid, snoozeTime(el.dataset.k)); openEditor(rid); break; }
    case 'sub-toggle': { const sid = el.closest('[data-sid]').dataset.sid; const r = S.reminders[UI.editing]; update(UI.editing, { subtasks: r.subtasks.map(s => s.id === sid ? { ...s, done: el.checked } : s) }); el.closest('.sub').classList.toggle('done', el.checked); break; }
    case 'sub-del': { const sid = el.closest('[data-sid]').dataset.sid; update(UI.editing, { subtasks: S.reminders[UI.editing].subtasks.filter(s => s.id !== sid) }); openEditor(UI.editing); break; }
    // alerts
    case 'al-done': toggleDone(aid); break;
    case 'al-snooze': snooze(aid, snoozeTime(el.dataset.k)); break;
    case 'al-open': dismissAlert(aid); openEditor(aid); break;
    case 'al-dismiss': dismissAlert(aid); render(); break;
  }
}
function toggleSel(id) { if (UI.selected.has(id)) UI.selected.delete(id); else UI.selected.add(id); render(); }
function listMenu(anchor) {
  const lid = currentListId(); const l = lid && listById(lid);
  const items = [
    { label: 'Add example reminders', run: loadExamples },
    { label: 'Export calendar (.ics)', run: exportICS },
    { label: 'Export backup (.json)', run: exportJSON },
  ];
  if (l) items.unshift({ label: 'Rename or recolor list…', run: () => listModal(l) }, { label: 'Delete list…', danger: true, run: () => deleteList(l) }, '-');
  if (all().some(r => r.done)) items.push('-', { label: 'Clear completed…', danger: true, run: () => { const ids = all().filter(r => r.done && (!l || r.listId === l.id)).map(r => r.id); confirmDialog('Clear completed?', `Delete ${ids.length} completed reminder${ids.length === 1 ? '' : 's'}${l ? ' in ' + l.name : ''}.`, 'Clear', () => removeReminders(ids)); } });
  openMenu(anchor, items);
}

let gPending = false;
function markKb() {
  document.querySelectorAll('.row.kb').forEach(r => r.classList.remove('kb'));
  const id = visibleIds[UI.kbIndex]; if (!id) return;
  const el = document.querySelector(`.row[data-id="${id}"]`); if (el) { el.classList.add('kb'); el.scrollIntoView({ block: 'nearest' }); }
}
function onKey(e) {
  if (document.querySelector('.modal-back')) return;
  if (e.key === 'Escape') {
    if (document.querySelector('.menu')) return closeMenu();
    if (UI.editing) return closeEditor();
    if (UI.selecting) { UI.selecting = false; UI.selected.clear(); return render(); }
    if (alertQueue.length) { alertQueue.length = 0; return renderAlerts(); }
  }
  if (isTyping() || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (gPending) {
    gPending = false;
    const m = { t: 'today', a: 'all', s: 'scheduled', f: 'flagged', o: 'overdue', d: 'completed', r: 'trash' }[k.toLowerCase()];
    if (m) { UI.view = m; UI.mode = 'list'; render(); } else if (k.toLowerCase() === 'c') { UI.mode = 'calendar'; render(); } else if (k.toLowerCase() === 'b') { UI.mode = 'board'; render(); }
    return;
  }
  const id = visibleIds[UI.kbIndex];
  switch (k) {
    case 'n': case 'N': e.preventDefault(); if (UI.mode === 'stats') { UI.mode = 'list'; render(); } $('#quickInput').focus(); break;
    case '/': e.preventDefault(); $('#search').focus(); break;
    case '?': shortcutsModal(); break;
    case 'r': reviewOverdue(); break;
    case 'z': if (id) focusModal(id); break;
    case 'g': gPending = true; setTimeout(() => gPending = false, 1200); break;
    case 'j': case 'ArrowDown': if (!visibleIds.length) return; e.preventDefault(); UI.kbIndex = Math.min(visibleIds.length - 1, UI.kbIndex + 1); markKb(); break;
    case 'k': case 'ArrowUp': if (!visibleIds.length) return; e.preventDefault(); UI.kbIndex = Math.max(0, UI.kbIndex - 1); markKb(); break;
    case 'x': case ' ': if (id) { e.preventDefault(); toggleDone(id); } break;
    case 'e': case 'Enter': if (id) { e.preventDefault(); openEditor(id); } break;
    case 'f': if (id) update(id, { flagged: !S.reminders[id].flagged }); break;
    case '0': case '1': case '2': case '3': if (id) update(id, { priority: +k }); break;
    case 't': if (id) update(id, quickDue('today')); break;
    case 'm': if (id) update(id, quickDue('tomorrow')); break;
    case 's': if (id && S.reminders[id].due != null) snooze(id, snoozeTime('1h')); break;
    case 'Delete': case 'Backspace': if (id) { removeReminders([id]); UI.kbIndex = Math.min(UI.kbIndex, visibleIds.length - 1); } break;
  }
}

/* ---------- Boot ---------- */
async function boot() {
  await Store.init();
  { const cutoff = Date.now() - 30 * DAY; const old = trashed().filter(r => r.deletedAt < cutoff).map(r => r.id); if (old.length) purge(old); }
  if (window.claude?.use) window.claude.use('sample').then((x) => { AI.sample = x || null; }).catch(() => {});
  applyTheme();
  buildShell();
  renderSync();
  render();
  renderAlerts();
  tick();
  setInterval(tick, 15000);
  runFocus();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  // expose for tests
  window.__nudge = { parseQuick, S, nextOccurrence, matchesQuery, streakOf, AI };
}
boot();
})();
</script>
