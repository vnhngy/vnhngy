 catch(e){const m=String(e&&e.message||e);if(m==='Zeit')res.push([1,'Standort erlaubt: Das Wetter passt sich an, sobald das GPS-Signal da ist']);else if(GP.err&&m===GP.err&&/ausgeschaltet/.test(m))res.push([0,m+' Schalte ihn in den Schnelleinstellungen ein, dann klappt es beim nächsten Start.']);else{S.gpsPlace=false;res.push([0,WEBAPP?'Standort wurde nicht erlaubt. Auf dem iPhone: Einstellungen → Datenschutz → Ortungsdienste → Safari-Websites → „Beim Verwenden“.':'Standort wurde nicht erlaubt. Du kannst ihn später unter Anpassen → App einschalten.'])}}

let alT=0;
function syncAlarms(){if(!HAS2)return;const now=Date.now(),at9=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0).getTime(),ok=!!S.notify;
 const set=(id,at,ti,tx)=>{try{if(ok&&at>now+5000)APP.schedule(id,at,ti,tx);else APP.cancel(id)}catch(e){}};const t=new Date();
 set(1,S.timer.end&&!S.timer.rang?S.timer.end:0,`${S.timer.label||'Timer'} ist abgelaufen`,'Tippen, um Mein Auto zu öffnen');
 const hu=huDue(S.car.hu);set(2,hu?at9(addD(hu,-14)):0,'HU in 2 Wochen fällig',hu?`Plakette ${fmt(hu,{month:'long',year:'numeric'})} – jetzt einen Termin machen.`:'');
 const md=S.maint.map(m=>({m,r:maintStatus(m,t,carKm())})).filter(x=>x.r.due&&x.r.days>=7).sort((a,b)=>a.r.due-b.r.due)[0];set(3,md?at9(addD(md.r.due,-7)):0,md?`${md.m.n} in einer Woche fällig`:'','Details in Mein Auto → Wartung');
 const ev=S.events.map(e=>({e,d:nextOcc(e,t)})).filter(x=>x.d&&at9(x.d)>now).sort((a,b)=>a.d-b.d)[0];set(4,ev?at9(ev.d):0,ev?`Heute: ${ev.e.n}`:'','Dein Countdown ist bei null.');
 const ins=insDeadline(t.getFullYear());set(5,at9(addD(ins,-7)),'Kfz-Versicherung: noch eine Woche',`Kündigungen müssen bis ${fmt(ins,{day:'numeric',month:'long'})} beim Versicherer sein.`);
 set(6,S.park.until||0,'Parkzeit läuft gleich ab','Noch 10 Minuten – Zeit, zum Auto zu gehen.')}
function syncSoon(){clearTimeout(alT);alT=setTimeout(syncAlarms,1500)}

function backupNow(auto){if(!HAS2)return false;const d=new Date(),name=`MeinAuto-Sicherung-${iso(d)}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`;let p='';try{p=APP.saveBackup(name,JSON.stringify(S))}catch(e){}
 if(p){S.lastBak=Date.now();save();toast(WEBAPP?'Wähle jetzt „In Dateien sichern“ oder Drive':(auto?'Automatische Sicherung: ':'Gesichert: ')+p);return true}if(!auto)toast('Die Sicherung konnte nicht gespeichert werden.');return false}
window.__restoreFile=txt=>{try{const d=JSON.parse(txt);if(!d||typeof d!=='object'||!d.car)throw 0;const old=JSON.stringify(S);S=merge(d);commit(true);toast('Sicherung wiederhergestellt',()=>{S=merge(JSON.parse(old));commit(true)})}catch(e){toast('Das ist keine gültige Sicherung.')}};

async function parkHere(){if(!HAS2){S.park.t=Date.now();save();renderCard('timer');return}toast('Standort wird ermittelt …');try{const f=await locateOnce();S.park={...S.park,t:Date.now(),lat:f.lat,lon:f.lon,acc:Math.round(f.acc)};save();renderCard('timer');renderCard('kurz');toast(`Parkplatz gemerkt (±${nf(f.acc)} m)`)}catch(e){S.park.t=Date.now();save();renderCard('timer');toast(GP.err||'Kein GPS-Signal – nur die Zeit wurde gemerkt.')}}

const timerDone=()=>S.timer.end>0&&S.timer.end<=Date.now();

 let b='';

  ${P.lat?`<div class="rowb" style="justify-content:flex-start"><a class="btn pri" href="${parkNav(P)}" target="_blank" rel="noopener">Zum Auto navigieren</a><a class="btn" href="${parkMap(P)}" target="_blank" rel="noopener">Auf Karte zeigen</a></div><span class="k">Standort gespeichert (±${nf(P.acc||0)} m)</span>`:''}
  <div class="rowb"><button type="button" class="${P.lat?'':'pri'}" data-act="parknow">${HAS2?'Standort merken':'Jetzt geparkt'}</button>${P.t||P.txt?'<button type="button" data-act="parkclear">Zurücksetzen</button>':''}<button type="button" data-tmin="120" data-lab="Parkschein">Parkuhr 2 Std.</button></div>${upNote()}`}
 return`<div class="ch"><h2 id="h-timer">Timer & Parken</h2></div><div class="seg" role="group" aria-label="Werkzeug">${tabs.map(([k,n])=>`<button type="button" data-tab="t" data-k="${k}" aria-pressed="${ttab===k}">${n}</button>`).join('')}</div>${b}`}
function monthEvents(y,m){const E=[],inM=d=>d&&d.getFullYear()===y&&d.getMonth()===m;
 for(const[n,d]of holidays(y))if(inM(d))E.push({d,n,k:'h'});
 for(const e of S.events){const d=pD(e.d);if(!d)continue;const o=e.y?new Date(y,d.getMonth(),d.getDate()):d;if(inM(o)&&(!e.y||y>=d.getFullYear()))E.push({d:o,n:e.n,k:'e'})}
 const hu=huDue(S.car.hu);if(inM(hu))E.push({d:hu,n:'HU fällig',k:'c'});
 for(const it of S.maint){const r=maintStatus(it,new Date(),carKm());if(r.due&&inM(r.due))E.push({d:r.due,n:`${it.n} fällig`,k:'c'})}
 if(m===2||m===9)E.push({d:lastSun(y,m),n:'Zeitumstellung',k:'e'});
 if(m===10)E.push({d:insDeadline(y),n:'Stichtag Kfz-Versicherung',k:'c'});
 return E.sort((a,b)=>a.d-b.d)}
function wKalender(t){const base=new Date(t.getFullYear(),t.getMonth()+calOff,1),y=base.getFullYear(),m=base.getMonth(),E=monthEvents(y,m);
 const first=addD(base,-((base.getDay()+6)%7));let cells='';
 for(let i=0;i<42;i++){const d=addD(first,i);if(i>=35&&d.getMonth()!==m)break;const k=iso(d),ev=E.filter(e=>iso(e.d)===k),dot=ev.some(e=>e.k==='c')?'c':ev.some(e=>e.k==='e')?'e':ev.length?'h':'';
  cells+=`<button type="button" class="d${d.getMonth()!==m?' o':''}${diffD(t,d)===0?' t':''}${selDay===k?' s':''}" data-day="${k}" aria-label="${esc(fmt(d,{weekday:'long',day:'numeric',month:'long'}))}${ev.length?': '+esc(ev.map(e=>e.n).join(', ')):''}">${d.getDate()}${dot?`<i class="${dot}"></i>`:''}</button>`}
 const shown=selDay?E.filter(e=>iso(e.d)===selDay):E;
 return`<div class="ch"><h2 id="h-kalender">Kalender</h2></div>
 <div class="calh"><button type="button" class="ico sm" data-cal="-1" aria-label="Vorheriger Monat">${IC.prev}</button><b>${esc(fmt(base,{month:'long',year:'numeric'}))}</b><div style="display:flex;gap:.3rem">${calOff?'<button type="button" class="sm" data-cal="0">Heute</button>':''}<button type="button" class="ico sm" data-cal="1" aria-label="Nächster Monat">${IC.next}</button></div></div>
 <div class="cal">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<span class="dn">${x}</span>`).join('')}${cells}</div>
 ${shown.length?`<ul class="evl">${shown.map(e=>`<li><b>${esc(fmt(e.d,{day:'numeric',month:'short'}))}</b><span>${esc(e.n)}</span></li>`).join('')}</ul>`:`<p class="note">${selDay?'An diesem Tag steht nichts an.':'In diesem Monat steht nichts an.'}</p>`}
 ${WEBAPP?`<div class="rowb" style="justify-content:flex-start;margin-top:.6rem"><button type="button" class="sm" data-act="ics">Neue Termine in den ${IOS?'iPhone-':''}Kalender</button><button type="button" class="sm" data-act="icsall">Alle nochmal</button></div><p class="note">Übernimmt Countdowns, HU, Wartung und den Versicherungs-Stichtag – Auto-Termine mit Erinnerung eine Woche und einen Tag vorher.</p>`:''}`}
function e12up(R){const E=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];let d=Math.pow(10,Math.floor(Math.log10(R)));for(let g=0;g<12;g++){for(const e of E){const v=Math.round(e*d*1e4)/1e4;if(v>=R*.999)return v}d*=10}return R}
function obd(code){const c=String(code||'').trim().toUpperCase().replace(/\s/g,'');if(!c)return null;const m=/^([PBCU])([0-3])([0-9A-F])([0-9A-F]{2})$/.exec(c);if(!m)return{err:'Ein Fehlercode hat fünf Zeichen, z.B. P0420.'};
 const sys={P:'Antrieb (Motor, Getriebe)',B:'Karosserie (Airbag, Komfort, Licht)',C:'Fahrwerk (ABS, Lenkung, Federung)',U:'Netzwerk (Kommunikation der Steuergeräte)'}[m[1]];
 const typ={0:'genormter Code, gilt für alle Hersteller',1:'herstellerspezifischer Code',2:'meist genormter Code',3:'teils herstellerspezifischer Code'}[m[2]];
 const grp=m[1]==='P'&&m[2]!=='3'?({0:'Kraftstoff, Luft und Zusatz-Emissionen',1:'Kraftstoff- und Luftzumessung',2:'Kraftstoff- und Luftzumessung (Einspritzung)',3:'Zündung und Zündaussetzer',4:'Abgasnachbehandlung',5:'Geschwindigkeit, Leerlauf, Hilfseingänge',6:'Steuergerät und Ausgänge',7:'Getriebe',8:'Getriebe',9:'Getriebe',A:'Hybridantrieb',B:'Hybridantrieb',C:'Hybridantrieb'}[m[3]]||''):'';
 const cyl=/^P030([1-9])$/.exec(c);return{code:c,sys,typ,grp,known:OBD[c]||(cyl?`Zündaussetzer in Zylinder ${cyl[1]}`:null)}}
function calcOut(){const n=k=>pDec(calc[k]),T=(k,v)=>`<div class="tile"><span class="k">${k}</span><b>${v}</b></div>`;
 if(wtab==='fahrt'){const st=fuelStats(new Date()),d=n('dist');if(!(d>0))return'<p class="note">Strecke eingeben – Verbrauch und Preis kommen aus deinem Tankbuch, wenn du die Felder leer lässt.</p>';
  const km=d*(calc.rt?2:1),cons=n('cons')>0?n('cons'):(st.avg||7),pr=n('price')>0?n('price'):(st.ppl||1.75),p=Math.max(1,pInt(calc.pers)||1),l=km*cons/100,e=l*pr;
  return T('Strecke',nf(km)+' km')+T('Sprit',nf(l,1)+' l')+T('Kosten',nf(e,2)+' €')+(p>1?T('Pro Person',nf(e/p,2)+' €'):'')}
 if(wtab==='ohm'){let U=n('u'),I=n('i'),R=n('r');if([U,I,R].filter(x=>!isNaN(x)).length!==2)return'<p class="note">Genau zwei der drei Werte eingeben, der dritte wird berechnet.</p>';
  if(isNaN(U))U=I*R;else if(isNaN(I))I=U/R;else R=U/I;if(![U,I,R].every(isFinite))return'<p class="note">Mit diesen Werten geht die Rechnung nicht auf (Division durch null).</p>';
  return T('Spannung U',fmtSI(U,'V'))+T('Strom I',fmtSI(I,'A'))+T('Widerstand R',fmtSI(R,'Ω'))+T('Leistung P',fmtSI(U*I,'W'))}
 if(wtab==='led'){const vs=n('vs'),vf=n('vf'),ma=n('ma'),cnt=Math.max(1,pInt(calc.n)||1);if(!(vs>0&&vf>0&&ma>0))return'<p class="note">Alle Werte eingeben.</p>';
  const dv=vs-cnt*vf;if(dv<=0)return'<p class="note">Die Versorgungsspannung reicht für so viele LEDs in Reihe nicht.</p>';
  const I=ma/1000,R=dv/I,E=e12up(R),P=I*I*E,W=P*2<=.25?'0,25 W':P*2<=.5?'0,5 W':P*2<=1?'1 W':P*2<=2?'2 W':'mind. '+nf(Math.ceil(P*2))+' W';
  return T('Berechnet',fmtSI(R,'Ω'))+T('Nächster E12-Wert',fmtSI(E,'Ω'))+T('Verlustleistung',fmtSI(P,'W'))+T('Bauform',W)}
 if(wtab==='obd'){const r=obd(calc.code);if(!r)return'<p class="note">Code eingeben, z.B. P0420.</p>';if(r.err)return`<p class="note">${esc(r.err)}</p>`;
  return`<div class="tile obd"><span class="code">${esc(r.code)}</span><p>${r.known?esc(r.known):'Nicht in der Liste häufiger Codes – die Einordnung unten hilft trotzdem.'}</p><ul><li>Bereich: ${esc(r.sys)}</li><li>${esc(r.typ)}</li>${r.grp?`<li>Gruppe: ${esc(r.grp)}</li>`:''}</ul></div>`}
 return''}

 const inp=(k,l,ph,im='decimal')=>`<label>${l}<input data-c="${k}" inputmode="${im}" value="${v(k)}" placeholder="${esc(ph)}"></label>`;
 if(wtab==='fahrt')b=`<div class="form">${inp('dist','Strecke (km)','z.B. 320')}${inp('cons','Verbrauch l/100 km',nf(st.avg||7,1))}${inp('price','Preis €/Liter',nf(st.ppl||1.75,2))}${inp('pers','Personen','1','numeric')}</div><label class="ck"><input type="checkbox" data-c="rt"${calc.rt?' checked':''}>Hin- und Rückfahrt</label>`;

 <section class="fs" id="set-bk"><h3>Sicherung</h3><p class="mini"><b>Status:</b> <span id="syncTxt">${esc(syncTxt)}</span></p><p class="note">Alles speichert automatisch. Zusätzlich kannst du deine Daten als Text kopieren und später hier wieder einfügen (ohne Hintergrundfoto).</p><div class="rowb" style="justify-content:flex-start"><button type="button" id="bkCopy">Daten kopieren</button></div><label>Gesicherten Text einfügen<textarea id="bkIn" rows="3"></textarea></label><div class="rowb" style="justify-content:flex-start"><button type="button" id="bkRes">Wiederherstellen</button><button type="button" id="resetAll">${resetArm?'Wirklich alles zurücksetzen?':'Alles zurücksetzen'}</button></div>${APP&&!WEBAPP?'<div class="tile fs" style="gap:.5rem"><b>App-Oberfläche</b><span class="note">Hast du eine neue index.html bekommen? Hier auswählen – deine Daten bleiben erhalten.</span><div><button type="button" id="appUpd">Neue Version laden</button></div></div>':''}</section>`}
const openSet=()=>{resetArm=false;renderSet();$('#set').hidden=false;setupLens();$('#closeSet').focus()};
const closeSet=()=>{$('#set').hidden=true;$('#openSet').focus()};
$('#openSet').addEventListener('click',openSet);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const gf=$('#gfull');if(gf&&!gf.hidden){gFullClose();return}const pv=$('#phv');if(pv&&!pv.hidden){pv.hidden=true;return}if(!$('#standby').hidden)closeSB();else if(!$('#set').hidden)closeSet()});
async function loadPhoto(file){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 let cv=c,q=.82,d=cv.toDataURL('image/jpeg',q);while(d.length>230000&&q>.4){q-=.08;d=cv.toDataURL('image/jpeg',q)}
 while(d.length>230000&&cv.width>320){const c2=document.createElement('canvas');c2.width=Math.round(cv.width*.75);c2.height=Math.round(cv.height*.75);c2.getContext('2d').drawImage(cv,0,0,c2.width,c2.height);cv=c2;d=cv.toDataURL('image/jpeg',.6)}
 const s=document.createElement('canvas');s.width=s.height=24;const sx=s.getContext('2d');sx.drawImage(cv,0,0,24,24);const px=sx.getImageData(0,0,24,24).data;let L=0;for(let i=0;i<px.length;i+=4)L+=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];L/=576*255;
 return{img:d,tone:L<.38?'d':L>.68?'l':'m'}}finally{URL.revokeObjectURL(url)}}
const P=$('#set');
P.addEventListener('click',async e=>{if(e.target===P)return closeSet();const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
 if(b.id==='closeSet')return closeSet();
 if(ds.go){$('#'+ds.go)?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(ds.wall){S.wall=ds.wall;commit(true);refocus(`[data-wall="${ds.wall}"]`);return}
 if(ds.act==='photo'){if(wallImg&&S.wall!=='foto'){S.wall='foto';commit(true);refocus('[data-act=photo]')}else $('#wallFile').click();return}
 if(ds.act==='photodel'){wallImg=null;if(S.wall==='foto')S.wall='rot';saveWall();commit(true);return}
 if(ds.look){S.look=ds.look;commit(true);refocus(`[data-look="${ds.look}"]`);return}
 if(ds.acc){S.accent=ds.acc;commit(true);refocus(`[data-acc="${ds.acc}"]`);return}
 if(ds.glass){const[bl,ti]=ds.glass.split(',').map(Number);S.blur=bl;S.tint=ti;commit(true);refocus(`[data-glass="${ds.glass}"]`);return}
 if(ds.fs){S.fs=+ds.fs;commit(true);refocus(`[data-fs="${ds.fs}"]`);return}
 if(ds.mv){const i=+ds.mv,d=+ds.d,j=i+d;if(j<0||j>=S.widgets.length)return;[S.widgets[i],S.widgets[j]]=[S.widgets[j],S.widgets[i]];commit(true);refocus(`[data-mv="${j}"][data-d="${d}"]:not(:disabled)`);return}
 if(b.id==='appUpd'){try{APP.pickPage()}catch(err){}return}
 if(b.id==='bakFile'){backupNow(false);renderSet();return}
 if(b.id==='syNew'){if(!syOk())return;SY={code:syNewCode(),ver:0,dirty:true,at:0,err:'',at0:0};syK=null;syArm='';sySave();renderSet();syRun().then(()=>{if(!SY.err)toast('Abgleich ist an – gib den Code auf dem zweiten Gerät ein')});return}
 if(b.id==='syJoin'){const inp=$('#syIn'),c=syNorm(inp?inp.value:syPend);if(c.length!==20){toast('Der Code hat 20 Zeichen, zum Beispiel ABCD-EFGH-JKLM-NPQR-STUV.');return}if(syArm!=='join'){syArm='join';syPend=c;renderSet();refocus('#syJoin');return}syJoin(c);return}
 if(b.id==='syCopy'){const t=syFmt(SY.code);try{if(APP)APP.copy(t);else navigator.clipboard.writeText(t)}catch(err){}toast('Code kopiert');return}
 if(b.id==='syNow'){syRun();return}
 if(b.id==='syHist'){syArm='';syHistLoad();return}
 if(ds.syh!=null){syHistOpen(+ds.syh);return}
 if(b.id==='syRest'){if(syArm!=='rest'){syArm='rest';syHistUi();refocus('#syRest');return}syRestore();return}
 if(b.id==='syOff'){if(syArm!=='off'){syArm='off';renderSet();refocus('#syOff');return}SY={code:'',ver:0,dirty:false,at:0,err:''};syK=null;syArm='';syH=null;FO={n:0,open:0,full:false};sySave();renderSet();toast('Abgleich getrennt – die Daten bleiben auf diesem Gerät');return}
 if(b.id==='bakShare'){const d=new Date(),name=`MeinAuto-Sicherung-${iso(d)}.json`;let ok=false;try{ok=APP.shareFile(name,'application/json',JSON.stringify(S))}catch(err){}if(!ok)toast('Teilen klappt hier nicht – nutze „Jetzt als Datei sichern“.');return}
 if(b.id==='btPick'){btPick();return}
 if(b.id==='btClear'){S.bt={a:'',n:'',stop:true};btList=null;try{APP.btWatch('')}catch(err){}commit(true);toast('Bluetooth-Start ist ausgeschaltet');return}
 if(ds.bti!=null){const d=btList&&btList[+ds.bti];if(!d)return;S.bt={a:d.a,n:d.n,stop:true};btList=null;try{APP.btWatch(d.a)}catch(err){}commit(true);toast(`„${d.n}“ gespeichert – beim nächsten Verbinden startet die Fahrt`);return}
 if(b.id==='bakLoad'){try{APP.pickBackup()}catch(err){}return}
 if(b.id==='bkCopy'){const txt=JSON.stringify(S);if(APP){try{APP.copy(txt);toast('Daten kopiert – füge sie z.B. in eine Notiz ein.');return}catch(err){}}try{await navigator.clipboard.writeText(txt);toast('Daten kopiert – füge sie z.B. in eine Notiz ein.')}catch(err){const ta=$('#bkIn');ta.value=txt;ta.focus();ta.select();toast('Text ist markiert – jetzt kopieren.')}return}
 if(b.id==='bkRes'){try{const d=JSON.parse($('#bkIn').value);if(!d||typeof d!=='object'||!d.car)throw 0;S=merge(d);commit(true);toast('Daten wiederhergestellt')}catch(err){toast('Das sieht nicht nach einer Sicherung aus.')}return}
 if(b.id==='resetAll'){if(!resetArm){resetArm=true;renderSet();refocus('#resetAll');return}resetArm=false;const old=S;S=defaults();commit(true);toast('Alles zurückgesetzt',()=>{S=old;commit(true)})}});
P.addEventListener('input',e=>{const el=e.target,ds=el.dataset;if(el.type==='checkbox'||el.tagName==='SELECT'||el.type==='file')return;
 if(ds.r){S[ds.r]=+el.value;$(ds.r==='blur'?'#vBlur':'#vTint').textContent=el.value+(ds.r==='blur'?' px':' %');applyLook();setupLens();save();return}
 if(ds.f==='name'){S.name=el.value.slice(0,40);save();header(new Date());return}
 if(ds.p){if(ds.p==='n')S.place.n=el.value.slice(0,40);else{const v=pDec(el.value),lim=ds.p==='lat'?90:180;if(isNaN(v)||Math.abs(v)>lim)return;S.place[ds.p]=v}commit();return}
 if(ds.car){S.car[ds.car]=['km','svcKm','svcInt','tank'].includes(ds.car)?pInt(el.value):el.value.slice(0,60);S.car.sample=false;commit();return}
 if(el.id==='accC'){S.accent=el.value;applyLook();save()}});
P.addEventListener('change',async e=>{const el=e.target,ds=el.dataset;
 if(el.id==='accC'){commit(true);return}
 if(ds.r){commit();return}
 if(ds.won||ds.wide){const w=S.widgets.find(x=>x.id===(ds.won||ds.wide));if(w){w[ds.won?'on':'wide']=el.checked;commit()}return}
 if(ds.sw){S[ds.sw]=el.checked;commit();if(ds.sw==='notify'&&el.checked)try{APP.askNotify()}catch(e){}if(ds.sw==='gpsPlace'&&el.checked)placeFromGps();if(ds.sw==='autoBak'&&el.checked&&!S.lastBak)backupNow(true);return}
 if(ds.tk){S.tk[ds.tk]=ds.tk==='rad'?+el.value:el.value.trim();SP.data=null;save();return}
 if(ds.btstop!=null){S.bt.stop=el.checked;save();return}
 if(el.id==='city'){const c=CITIES.find(x=>x[0]===el.value);if(c){S.place={n:c[0],lat:c[1],lon:c[2]};commit(true);refocus('#city');fetchWx(true)}return}
 if(ds.car==='tires'||ds.car==='fuel'){S.car[ds.car]=el.value;S.car.sample=false;commit();return}
 if(el.id==='wallFile'&&el.files&&el.files[0]){try{toast('Foto wird vorbereitet …');const r=await loadPhoto(el.files[0]);wallImg=r.img;S.wallTone=r.tone;S.wall='foto';saveWall();commit(true);toast('Hintergrund gesetzt')}catch(err){toast('Dieses Bild konnte nicht geladen werden.')}}});
P.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('fine'))fineOpen=e.target.open},true);

setInterval(()=>fetchWx(),10*6e4);
render();fetchWx();
if(HAS2){if(S.tripLive){gpsNeed('trip',true);try{APP.keepOn(true)}catch(e){}}syncAlarms();placeFromGps();if(S.autoBak&&!WEBAPP&&Date.now()-(S.lastBak||0)>7*864e5)setTimeout(()=>backupNow(true),4000)}if(mig&&!ref)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
document.body.insertAdjacentHTML('beforeend','<input type="file" id="phFile" accept="image/*" hidden>');$('#phFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)addPhoto(f)});
if(window.indexedDB)setTimeout(phGC,8000);
if(HAS3){try{APP.btWatch(S.bt.a||'')}catch(e){}bgSoon();setTimeout(()=>window.__appAct(),400)}
if(WEBAPP&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(SY.code){syLast=JSON.stringify(syOut());setTimeout(syRun,900)}
document.addEventListener('visibilitychange',()=>{if(SY.code)syRun()});addEventListener('online',()=>{if(SY.code)syRun()});
setInterval(()=>{if(SY.code&&document.visibilityState==='visible')syRun()},45000);
}
</script>
