name: Autobuch-Tests

on:
  push:
    paths: ['autobuch/**', '.github/workflows/autobuch-tests.yml']
  pull_request:
    paths: ['autobuch/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autobuch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
