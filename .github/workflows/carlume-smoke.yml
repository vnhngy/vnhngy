# Selbsttest auf echten Systemen: startet die App im iPhone-Simulator und im Android-Emulator,
# lässt sie sich selbst bedienen (tools/smoke.js: Ort 74072, Auto anlegen, Karte) und macht Bildschirmfotos.
# Die Fotos landen im Branch "drivo-app-check" (Ordner ios/ und android/).
name: Carlume Selbsttest

on:
  push:
    branches: [drivo-app]
  workflow_dispatch:

concurrency:
  group: carlume-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  SMOKE: "1"

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Xcode 26 wählen
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Bauen
        run: |
          set -eo pipefail
          npm install --no-audit --no-fund
          python3 tools/build_www.py
          npx cap add ios
          npx capacitor-assets generate --ios --assetPath assets
          python3 tools/patch_native.py ios
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build | tail -n 30
      - name: Im Simulator starten und fotografieren
        run: |
          set -eo pipefail
          DEV=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']];print((c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')])[-1]['udid'])")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark || true
          xcrun simctl install "$DEV" build-ios/Build/Products/Debug-iphonesimulator/App.app
          ID=$(python3 -c "import json;print(json.load(open('app.config.json'))['appId'])")
          mkdir -p shots/ios; xcrun simctl list devices | grep "$DEV" > shots/ios/geraet.txt
          xcrun simctl launch "$DEV" "$ID"
          for t in 8 40 55 70; do
            sleep $(( t - ${last:-0} )); last=$t
            xcrun simctl io "$DEV" screenshot "shots/ios/$t.png"
          done
          xcrun simctl terminate "$DEV" "$ID" || true
          # Neustart: Daten und Ort müssen noch da sein
          xcrun simctl launch "$DEV" "$ID"; sleep 12; xcrun simctl io "$DEV" screenshot shots/ios/neustart.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots-ios, path: shots/ios }

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Bauen
        run: |
          set -eo pipefail
          npm install --no-audit --no-fund
          python3 tools/build_www.py
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets
          python3 tools/patch_native.py android
          npx cap sync android
          (cd android && ./gradlew --no-daemon assembleDebug | tail -n 20)
      - name: KVM für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Im Emulator starten und fotografieren
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots-android, path: shots/android }

  bericht:
    needs: [ios, android]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: shots }
      - name: Fotos in den Branch drivo-app-check legen
        run: |
          cd shots; ls -R | head -40
          git init -q -b drivo-app-check; git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          echo "Selbsttest ${{ github.sha }} · iOS: ${{ needs.ios.result }} · Android: ${{ needs.android.result }}" > README.md
          git add -A; git commit -qm "Selbsttest ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" drivo-app-check
